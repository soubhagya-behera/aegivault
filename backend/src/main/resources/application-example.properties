# ===========================================================================
# SAFE EXAMPLE — this file IS committed to Git.
# Copy it to 'application.properties' (same directory) and put your REAL
# local PostgreSQL credentials in that copy:
#
#   copy src\main\resources\application-example.properties ^
#        src\main\resources\application.properties
#
# 'application.properties' is git-ignored and must NEVER be committed.
# Never put a real password, API key, JWT secret, token, or other credential
# in THIS file — only the YOUR_* placeholders below.
# ===========================================================================
spring.application.name=aegivault

spring.datasource.url=jdbc:postgresql://localhost:5432/YOUR_DATABASE_NAME
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT bearer authentication: HMAC SHA-256 secret, at least 256 bits
# (32+ characters). Generate one, e.g. 32 random bytes base64-encoded,
# and put the REAL value in your local 'application.properties' copy.
aegivault.security.jwt-secret=YOUR_32_PLUS_CHARACTER_JWT_SECRET_HERE_000000
