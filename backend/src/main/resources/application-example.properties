# ===========================================================================
# SAFE EXAMPLE — this file IS committed to Git.
# Copy it to 'application.properties' (same directory) and put your REAL
# local PostgreSQL credentials in that copy:
#
#   copy src\main\resources\application-example.properties ^
#        src\main\resources\application.properties
#
# 'application.properties' is git-ignored and must NEVER be committed.
# Never put a real password, API key, JWT secret, token, or other credential
# in THIS file — only the YOUR_* placeholders below.
# ===========================================================================
spring.application.name=aegivault

spring.datasource.url=jdbc:postgresql://localhost:5432/YOUR_DATABASE_NAME
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT bearer authentication: HMAC SHA-256 secret, at least 256 bits
# (32+ characters). Generate one, e.g. 32 random bytes base64-encoded,
# and put the REAL value in your local 'application.properties' copy.
aegivault.security.jwt-secret=YOUR_32_PLUS_CHARACTER_JWT_SECRET_HERE_000000

# Gateway provider selection: MOCK (default — deterministic in-process mock,
# labelled completions, no network, no credentials) or OLLAMA (local Ollama
# server over HTTP). Selection is explicit configuration only and is never
# inferred from the model name, a URL, the content, or request headers; API
# callers of POST /api/gateway/complete cannot choose the provider.
# An unsupported value fails fast at application startup.
aegivault.gateway.provider=MOCK

# Local Ollama provider settings — used only when
# aegivault.gateway.provider=OLLAMA. Localhost defaults only: no API key,
# no cloud credentials.
aegivault.gateway.ollama.base-url=http://localhost:11434
aegivault.gateway.ollama.connect-timeout=5s
aegivault.gateway.ollama.read-timeout=60s

# Gateway rate limiter selection: IN_MEMORY (default — process-local fixed
# window, no Redis needed) or REDIS (shared fixed-window counters in Redis
# for multi-instance enforcement). Selection is explicit configuration
# only. An unsupported value fails fast at application startup.
aegivault.gateway.rate-limiter=IN_MEMORY

# Redis connection for the REDIS rate limiter (Spring Boot defaults shown;
# used only when aegivault.gateway.rate-limiter=REDIS). Localhost values
# only — never put credentials in this file.
spring.data.redis.host=localhost
spring.data.redis.port=6379
